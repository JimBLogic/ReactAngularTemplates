name: TEMPORARY frontend lockfile audit (remove before PR review)

on:
  pull_request:
    paths:
      - .github/workflows/one-shot-lock-refresh.yml
      - package-lock.json

permissions:
  contents: read

jobs:
  resolve:
    if: github.repository == 'JimBLogic/ReactAngularTemplates' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'audit/template-ci-integrity-20261016'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Attempt compatible lockfile advisory fixes, without force or lifecycle scripts
        run: |
          set -euo pipefail
          npm audit fix --package-lock-only --ignore-scripts --no-fund || echo 'Some upstream advisories require incompatible major upgrades; report them, do not force.'
      - name: Reinstall and validate candidate from adjusted exact lockfile
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run validate
          npm test
          npm audit --omit=dev --audit-level=high
      - name: Report remaining toolchain advisories without suppressing their output
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Upload only candidate package-lock.json from this run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-compatible-lockfile-20261016
          path: package-lock.json
          retention-days: 1
          if-no-files-found: error

  write-candidate-lock:
    needs: resolve
    if: needs.resolve.result == 'success' && github.repository == 'JimBLogic/ReactAngularTemplates' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'audit/template-ci-integrity-20261016'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Download same-run candidate artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: candidate-compatible-lockfile-20261016
          path: .
      - name: Recheck allowlisted lock metadata without executing any package script
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          assert.equal(lock.lockfileVersion,3);
          assert.deepEqual(lock.packages[''].dependencies,pkg.dependencies);
          assert.deepEqual(lock.packages[''].devDependencies,pkg.devDependencies);
          for(const [name,metadata] of Object.entries(lock.packages)){
            if(!name || metadata.link)continue;
            assert.ok(metadata.integrity?.startsWith('sha512-'),name);
            assert.ok(metadata.resolved?.startsWith('https://registry.npmjs.org/'),name);
          }
          NODE
          git add -- package-lock.json
          if [ -z "$(git diff --cached --name-only)" ]; then
            echo 'No compatible lockfile changes were necessary.'
            exit 0
          fi
          test "$(git diff --cached --name-only)" = 'package-lock.json'
          git diff --cached --check
      - name: Commit only the validated candidate lockfile (never main)
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(deps): apply compatible advisory fixes to locked frontend tools'
          git push origin HEAD:refs/heads/audit/template-ci-integrity-20261016
