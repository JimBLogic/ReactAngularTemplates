<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - Modern Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div x-data="profile()" x-cloak class="min-h-screen py-8">
        <div class="max-w-4xl mx-auto px-4">
            <!-- Header -->
            <div class="mb-8">
                <h1 class="text-3xl font-bold text-gray-900 mb-2">User Profile</h1>
                <p class="text-gray-600">Manage your account settings and preferences</p>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Main Profile Card -->
                <div class="lg:col-span-2 bg-white rounded-xl shadow-sm border border-gray-200 p-8">
                    <div class="flex items-start justify-between mb-8">
                        <div class="flex items-center gap-6">
                            <div class="w-20 h-20 bg-blue-600 rounded-full flex items-center justify-center">
                                <span class="text-white text-2xl font-bold" x-text="user.initials"></span>
                            </div>
                            <div>
                                <h2 class="text-2xl font-bold text-gray-900 mb-1" x-text="user.name"></h2>
                                <p class="text-blue-600 mb-2" x-text="user.role"></p>
                                <div class="flex items-center gap-2">
                                    <div class="w-3 h-3 rounded-full bg-green-400"></div>
                                    <span class="text-sm text-gray-500">Online</span>
                                </div>
                            </div>
                        </div>
                        
                        <button 
                            @click="toggleEdit()"
                            class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition-colors"
                        >
                            <span x-text="isEditing ? 'Cancel' : 'Edit Profile'"></span>
                        </button>
                    </div>

                    <!-- Profile Form -->
                    <form @submit.prevent="saveProfile()" class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">
                                    Full Name
                                </label>
                                <input
                                    type="text"
                                    x-model="editData.name"
                                    :disabled="!isEditing"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 disabled:bg-gray-50 disabled:text-gray-500"
                                />
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">
                                    Email Address
                                </label>
                                <input
                                    type="email"
                                    x-model="editData.email"
                                    :disabled="!isEditing"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 disabled:bg-gray-50 disabled:text-gray-500"
                                />
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">
                                    Job Title
                                </label>
                                <input
                                    type="text"
                                    x-model="editData.role"
                                    :disabled="!isEditing"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 disabled:bg-gray-50 disabled:text-gray-500"
                                />
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">
                                    Department
                                </label>
                                <select
                                    x-model="editData.department"
                                    :disabled="!isEditing"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 disabled:bg-gray-50 disabled:text-gray-500"
                                >
                                    <option value="Engineering">Engineering</option>
                                    <option value="Marketing">Marketing</option>
                                    <option value="Sales">Sales</option>
                                    <option value="Support">Support</option>
                                    <option value="HR">Human Resources</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">
                                    Phone Number
                                </label>
                                <input
                                    type="tel"
                                    x-model="editData.phone"
                                    :disabled="!isEditing"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 disabled:bg-gray-50 disabled:text-gray-500"
                                />
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">
                                    Location
                                </label>
                                <input
                                    type="text"
                                    x-model="editData.location"
                                    :disabled="!isEditing"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 disabled:bg-gray-50 disabled:text-gray-500"
                                />
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                Bio
                            </label>
                            <textarea
                                x-model="editData.bio"
                                :disabled="!isEditing"
                                rows="4"
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 disabled:bg-gray-50 disabled:text-gray-500 resize-none"
                            ></textarea>
                        </div>

                        <div x-show="isEditing" class="flex gap-4">
                            <button
                                type="submit"
                                class="px-6 py-3 bg-green-600 hover:bg-green-700 text-white rounded-lg font-medium transition-colors"
                            >
                                Save Changes
                            </button>
                            <button
                                type="button"
                                @click="cancelEdit()"
                                class="px-6 py-3 bg-gray-600 hover:bg-gray-700 text-white rounded-lg font-medium transition-colors"
                            >
                                Cancel
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Sidebar -->
                <div class="space-y-6">
                    <!-- Quick Stats -->
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                        <h3 class="text-lg font-semibold text-gray-900 mb-4">Account Stats</h3>
                        <div class="space-y-4">
                            <div class="flex justify-between items-center">
                                <span class="text-gray-600">Member since</span>
                                <span class="font-medium text-gray-900" x-text="user.memberSince"></span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-gray-600">Last login</span>
                                <span class="font-medium text-gray-900" x-text="user.lastLogin"></span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-gray-600">Profile views</span>
                                <span class="font-medium text-gray-900" x-text="user.profileViews"></span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-gray-600">Account status</span>
                                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">
                                    Active
                                </span>
                            </div>
                        </div>
                    </div>

                    <!-- Recent Activity -->
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                        <h3 class="text-lg font-semibold text-gray-900 mb-4">Recent Activity</h3>
                        <div class="space-y-4">
                            <template x-for="activity in recentActivity" :key="activity.id">
                                <div class="flex items-center gap-3">
                                    <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center">
                                        <span class="text-blue-600 text-sm" x-text="activity.icon"></span>
                                    </div>
                                    <div>
                                        <p class="text-sm text-gray-900" x-text="activity.action"></p>
                                        <p class="text-xs text-gray-500" x-text="activity.time"></p>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- Quick Actions -->
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                        <h3 class="text-lg font-semibold text-gray-900 mb-4">Quick Actions</h3>
                        <div class="space-y-3">
                            <button class="w-full text-left px-4 py-3 bg-gray-50 hover:bg-gray-100 rounded-lg transition-colors">
                                <div class="flex items-center gap-3">
                                    <span class="text-lg">🔒</span>
                                    <span class="text-sm font-medium text-gray-700">Change Password</span>
                                </div>
                            </button>
                            <button class="w-full text-left px-4 py-3 bg-gray-50 hover:bg-gray-100 rounded-lg transition-colors">
                                <div class="flex items-center gap-3">
                                    <span class="text-lg">🔔</span>
                                    <span class="text-sm font-medium text-gray-700">Notification Settings</span>
                                </div>
                            </button>
                            <button class="w-full text-left px-4 py-3 bg-gray-50 hover:bg-gray-100 rounded-lg transition-colors">
                                <div class="flex items-center gap-3">
                                    <span class="text-lg">📄</span>
                                    <span class="text-sm font-medium text-gray-700">Download Data</span>
                                </div>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function profile() {
            return {
                isEditing: false,
                user: {
                    name: 'John Doe',
                    email: 'john.doe@company.com',
                    role: 'Senior Developer',
                    department: 'Engineering',
                    phone: '+1 (555) 123-4567',
                    location: 'San Francisco, CA',
                    bio: 'Passionate software developer with 5+ years of experience in building scalable web applications. Love working with modern technologies and solving complex problems.',
                    initials: 'JD',
                    memberSince: 'Jan 2022',
                    lastLogin: '2 hours ago',
                    profileViews: '247'
                },
                editData: {},
                recentActivity: [
                    {
                        id: 1,
                        icon: '👤',
                        action: 'Profile updated',
                        time: '2 hours ago'
                    },
                    {
                        id: 2,
                        icon: '🔒',
                        action: 'Password changed',
                        time: '1 day ago'
                    },
                    {
                        id: 3,
                        icon: '📄',
                        action: 'Report downloaded',
                        time: '3 days ago'
                    },
                    {
                        id: 4,
                        icon: '⚙️',
                        action: 'Settings updated',
                        time: '1 week ago'
                    }
                ],

                init() {
                    this.editData = { ...this.user };
                },

                toggleEdit() {
                    this.isEditing = !this.isEditing;
                    if (!this.isEditing) {
                        this.editData = { ...this.user };
                    }
                },

                saveProfile() {
                    // Simulate API call
                    setTimeout(() => {
                        this.user = { ...this.editData };
                        this.user.initials = this.user.name.split(' ').map(n => n[0]).join('').toUpperCase();
                        this.isEditing = false;
                        
                        // Add to activity log
                        this.recentActivity.unshift({
                            id: Date.now(),
                            icon: '👤',
                            action: 'Profile updated',
                            time: 'Just now'
                        });
                        
                        // Keep only last 4 activities
                        this.recentActivity = this.recentActivity.slice(0, 4);
                        
                        alert('Profile updated successfully!');
                    }, 500);
                },

                cancelEdit() {
                    this.editData = { ...this.user };
                    this.isEditing = false;
                }
            }
        }
    </script>
</body>
</html>
